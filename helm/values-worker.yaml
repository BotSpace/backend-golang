fullnameOverride: "backend-worker"
command: ["/app/worker"]

podLabels:
  app: botmother
  component: backend-worker

strategy:
  type: Recreate

service:
  enabled: false

probes:
  startup:
    enabled: true
    type: exec
    exec:
      command: ["/bin/sh", "-ec", "test \"$(cat /proc/1/comm)\" = worker"]
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readiness:
    enabled: true
    type: exec
    exec:
      command: ["/bin/sh", "-ec", "test \"$(cat /proc/1/comm)\" = worker"]
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    type: exec
    exec:
      command: ["/bin/sh", "-ec", "test \"$(cat /proc/1/comm)\" = worker"]
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

podDisruptionBudget:
  enabled: false

prometheus:
  scrape: false

persistentVolumeClaims: []

serviceAccount:
  create: true
  name: backend-worker
  rules:
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["get", "list", "delete"]
    - apiGroups: [""]
      resources: ["secrets", "configmaps", "services"]
      verbs: ["get", "list", "delete"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list"]

envFrom:
  - secretRef:
      name: botmother-secret
  - secretRef:
      name: backend-golang-db
  - secretRef:
      name: mongo-secret
  - secretRef:
      name: redis-secret

env:
  - name: K8S_NAMESPACE
    value: botmother

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
