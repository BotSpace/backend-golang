fullnameOverride: "backend-golang"

podLabels:
  app: botmother
  component: backend-golang

service:
  enabled: true
  port: 8080

probes:
  startup:
    enabled: true
    type: httpGet
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readiness:
    enabled: true
    type: httpGet
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    enabled: true
    type: httpGet
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

podDisruptionBudget:
  enabled: false

prometheus:
  scrape: false

envFrom:
  - secretRef:
      name: backend-golang-db
  - secretRef:
      name: backend-golang-app
  - secretRef:
      name: jwt-secret

env:
  - name: APP_ENV
    value: "production"
  - name: APP_HTTP_CORS_ORIGINS
    value: "https://botspace.uz,https://admin.botspace.uz"
  - name: APP_HTTP_RATE_LIMIT_RPS
    value: "20"
  - name: APP_HTTP_RATE_LIMIT_BURST
    value: "40"
  - name: APP_OTP_PROD
    value: "true"
  - name: APP_ENGINE_IMAGE_TAG
    value: "3.5.162-prod"
  # B2/S3 object-storage write credentials for the file-upload handler. Sourced
  # from the legacy Django secret (botmother-secret) so uploads land in the same
  # media bucket the worker cleanup and public media URLs already use. Injected
  # as individual keys (not envFrom) to avoid clobbering BOT_TOKEN etc.
  - name: APP_STORAGE_ID
    valueFrom:
      secretKeyRef:
        name: botmother-secret
        key: STORAGE_ID
  - name: APP_STORAGE_KEY
    valueFrom:
      secretKeyRef:
        name: botmother-secret
        key: STORAGE_KEY
  - name: APP_STORAGE_REGION
    valueFrom:
      secretKeyRef:
        name: botmother-secret
        key: STORAGE_REGION
  # Max request body. Default is 1 MiB, which 413s file uploads (the frontend
  # caps files at 50 MB). 60 MiB gives headroom for the 50 MB cap + multipart
  # overhead. The gateway's ClientSettingsPolicy for backend-golang-api must
  # allow at least this much too.
  - name: APP_HTTP_MAX_BODY_BYTES
    value: "62914560"

volumes:
  - name: jwt-keys
    secret:
      secretName: backend-golang-jwt

volumeMounts:
  - name: jwt-keys
    mountPath: /app/keys
    readOnly: true

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
